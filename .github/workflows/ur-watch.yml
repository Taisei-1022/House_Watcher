name: UR akabanedai watch

on:
  schedule:
    # 10分ごと。GitHub の scheduler は混雑時に遅延するので、
    # 実際の間隔は 10〜20分程度ぶれる。
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ur-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check vacancies
        env:
          # broadcast なので宛先指定は不要。友だち追加した全員に届く。
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          # 絞り込みたい場合だけコメントを外す
          # UR_MAX_RENT: "150000"
          # UR_MADORI: "2DK,2LDK,3LDK"
        run: python ur_watch.py

      - name: Save state
        if: always()
        run: |
          git config user.name  "ur-watch-bot"
          git config user.email "actions@github.com"
          git add state.json || true
          git diff --cached --quiet || git commit -m "chore: update state"
          git pull --rebase --autostash || true
          git push || true
